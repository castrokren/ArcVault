<svg xmlns="http://www.w3.org/2000/svg" width="680" height="412" viewBox="0 0 680 412">
<style>
  text{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
  .th{font-size:14px;font-weight:500}
  .ts{font-size:12px;font-weight:400;fill:#5F5E5A}
  .arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect width="680" height="412" fill="#ffffff"/>

<rect x="250" y="30" width="180" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="340" y="52" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Operator browser</text>
<text class="ts" x="352" y="92">HTTPS :443</text>
<line x1="340" y1="74" x2="340" y2="104" class="arr" marker-end="url(#arrow)"/>

<rect x="200" y="108" width="280" height="112" rx="16" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="340" y="132" text-anchor="middle" fill="#04342C">Coordinator service</text>
<text class="ts" x="340" y="150" text-anchor="middle">arcvault-coordinator</text>
<rect x="270" y="166" width="140" height="42" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="340" y="187" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">SQLite (WAL)</text>

<text class="ts" x="352" y="240">WS (origin-validated) + REST</text>
<line x1="340" y1="220" x2="340" y2="254" class="arr" marker-end="url(#arrow)"/>

<rect x="240" y="256" width="200" height="58" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="340" y="276" text-anchor="middle" fill="#26215C">Agent service</text>
<text class="ts" x="340" y="297" text-anchor="middle">runner &#183; robocopy/rsync</text>
<line x1="340" y1="314" x2="340" y2="348" class="arr" marker-end="url(#arrow)"/>

<rect x="255" y="350" width="170" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="340" y="372" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Backup target (disk)</text>

<rect x="500" y="118" width="140" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="570" y="140" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">Alert channels</text>
<line x1="482" y1="140" x2="498" y2="140" class="arr" marker-end="url(#arrow)"/>

<rect x="500" y="178" width="140" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="570" y="200" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">GitHub releases</text>
<line x1="482" y1="190" x2="498" y2="200" class="arr" marker-end="url(#arrow)"/>
</svg>
