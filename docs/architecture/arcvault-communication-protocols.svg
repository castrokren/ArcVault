<svg xmlns="http://www.w3.org/2000/svg" width="720" height="580" viewBox="0 0 720 580">
<style>
  text{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
  .th{font-size:14px;font-weight:500}
  .ts{font-size:11px;font-weight:400;fill:#5F5E5A}
  .proto{font-size:10px;font-weight:500;fill:#fff}
  .arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
  .dasharr{stroke:#5F5E5A;stroke-width:1.5;fill:none;stroke-dasharray:4,2}
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect width="720" height="580" fill="#ffffff"/>

<!-- Title -->
<text class="th" x="360" y="24" text-anchor="middle" fill="#2C2C2A">Communication Protocol Flow — Typical Job Execution</text>

<!-- Column headers -->
<rect x="20" y="50" width="160" height="32" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="100" y="71" text-anchor="middle" fill="#2C2C2A">Browser</text>

<rect x="280" y="50" width="160" height="32" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="360" y="71" text-anchor="middle" fill="#04342C">Coordinator</text>

<rect x="540" y="50" width="160" height="32" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="620" y="71" text-anchor="middle" fill="#26215C">Agent</text>

<!-- Vertical lines -->
<line x1="100" y1="82" x2="100" y2="560" class="dasharr" stroke-dasharray="3,3" stroke="#ddd"/>
<line x1="360" y1="82" x2="360" y2="560" class="dasharr" stroke-dasharray="3,3" stroke="#ddd"/>
<line x1="620" y1="82" x2="620" y2="560" class="dasharr" stroke-dasharray="3,3" stroke="#ddd"/>

<!-- 1. User creates job -->
<text class="ts" x="24" y="110" fill="#5F5E5A">1. Create job</text>
<line x1="100" y1="115" x2="360" y2="130" class="arr" marker-end="url(#arrow)"/>
<rect x="200" y="118" width="50" height="18" rx="3" fill="#00d4aa" opacity="0.8"/>
<text class="proto" x="225" y="130" text-anchor="middle" font-size="9">HTTPS</text>

<!-- 2. Store in DB -->
<text class="ts" x="284" y="155" fill="#5F5E5A">2. Store job</text>
<circle cx="360" cy="165" r="3" fill="#0F6E56"/>

<!-- 3. Broadcast to active WebSocket clients -->
<text class="ts" x="284" y="185" fill="#5F5E5A">3. WebSocket push</text>
<line x1="360" y1="190" x2="100" y2="210" class="arr" marker-end="url(#arrow)"/>
<rect x="210" y="193" width="60" height="18" rx="3" fill="#00d4aa" opacity="0.8"/>
<text class="proto" x="240" y="205" text-anchor="middle" font-size="9">WebSocket</text>

<!-- 4. Agent polls for jobs -->
<text class="ts" x="544" y="250" fill="#5F5E5A">4. Poll jobs</text>
<line x1="620" y1="255" x2="360" y2="275" class="arr" marker-end="url(#arrow)"/>
<rect x="430" y="258" width="50" height="18" rx="3" fill="#8b86ff" opacity="0.8"/>
<text class="proto" x="455" y="270" text-anchor="middle" font-size="9">HTTPS</text>

<!-- 5. Return job assignment -->
<text class="ts" x="284" y="300" fill="#5F5E5A">5. Return jobs</text>
<line x1="360" y1="305" x2="620" y2="325" class="arr" marker-end="url(#arrow)"/>
<rect x="430" y="308" width="50" height="18" rx="3" fill="#8b86ff" opacity="0.8"/>
<text class="proto" x="455" y="320" text-anchor="middle" font-size="9">HTTPS</text>

<!-- 6. Agent executes -->
<text class="ts" x="544" y="355" fill="#5F5E5A">6. Execute job</text>
<circle cx="620" cy="365" r="3" fill="#534AB7"/>

<!-- 7. Heartbeat (periodic) -->
<text class="ts" x="544" y="390" fill="#5F5E5A">7. Heartbeat</text>
<line x1="620" y1="395" x2="360" y2="410" class="arr" marker-end="url(#arrow)"/>
<rect x="430" y="398" width="50" height="18" rx="3" fill="#8b86ff" opacity="0.8"/>
<text class="proto" x="455" y="410" text-anchor="middle" font-size="9">HTTPS</text>

<!-- 8. Acknowledge heartbeat -->
<line x1="360" y1="430" x2="620" y2="445" class="arr" marker-end="url(#arrow)"/>
<rect x="430" y="433" width="50" height="18" rx="3" fill="#8b86ff" opacity="0.8"/>
<text class="proto" x="455" y="445" text-anchor="middle" font-size="9">HTTPS</text>

<!-- 9. Report results -->
<text class="ts" x="544" y="475" fill="#5F5E5A">9. Post results</text>
<line x1="620" y1="480" x2="360" y2="495" class="arr" marker-end="url(#arrow)"/>
<rect x="425" y="483" width="60" height="18" rx="3" fill="#8b86ff" opacity="0.8"/>
<text class="proto" x="455" y="495" text-anchor="middle" font-size="9">HTTPS+JSON</text>

<!-- 10. Broadcast completion -->
<text class="ts" x="284" y="520" fill="#5F5E5A">10. Update status</text>
<line x1="360" y1="525" x2="100" y2="545" class="arr" marker-end="url(#arrow)"/>
<rect x="205" y="528" width="60" height="18" rx="3" fill="#00d4aa" opacity="0.8"/>
<text class="proto" x="235" y="540" text-anchor="middle" font-size="9">WebSocket</text>

<!-- Legend -->
<text class="ts" x="24" y="575" fill="#5F5E5A" font-size="10">HTTPS = REST API (TLS encrypted) · WebSocket = Real-time push (TLS encrypted, origin-validated on browser)</text>
</svg>
