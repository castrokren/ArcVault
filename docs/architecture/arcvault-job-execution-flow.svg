<svg xmlns="http://www.w3.org/2000/svg" width="680" height="550" viewBox="0 0 680 550">
<style>
  text{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
  .th{font-size:14px;font-weight:500}
  .ts{font-size:12px;font-weight:400;fill:#5F5E5A}
  .arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
  .arr-cancel{stroke:#991B1B;stroke-width:1.5;fill:none}
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#991B1B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>
<rect width="680" height="550" fill="#ffffff"/>

<!-- Cancel path -->
<rect x="20" y="30" width="200" height="56" rx="8" fill="#FEE2E2" stroke="#991B1B" stroke-width="0.5"/>
<text class="th" x="120" y="52" text-anchor="middle" fill="#991B1B">Cancel job</text>
<text class="ts" x="120" y="68" text-anchor="middle" fill="#991B1B">Dashboard / API &#8594;</text>
<text class="ts" x="120" y="82" text-anchor="middle" fill="#991B1B">POST /api/jobs/{id}/cancel</text>
<path d="M120 86 L190 130" class="arr-cancel" marker-end="url(#arrow-red)"/>
<text class="ts" x="155" y="103" text-anchor="middle" fill="#991B1B">WS kill signal</text>

<rect x="20" y="202" width="200" height="56" rx="8" fill="#FEE2E2" stroke="#991B1B" stroke-width="0.5"/>
<text class="th" x="120" y="224" text-anchor="middle" fill="#991B1B">Agent terminates</text>
<text class="ts" x="120" y="242" text-anchor="middle" fill="#991B1B">exec.CommandContext</text>
<path d="M190 155 L120 155 L120 202" class="arr-cancel" marker-end="url(#arrow-red)"/>

<!-- Main flow -->
<rect x="190" y="30" width="300" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text class="th" x="340" y="52" text-anchor="middle" fill="#2C2C2A">Create job</text>
<text class="ts" x="340" y="70" text-anchor="middle">Dashboard &#8594; POST /api/jobs</text>
<line x1="340" y1="88" x2="340" y2="114" class="arr" marker-end="url(#arrow)"/>

<rect x="190" y="116" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="340" y="138" text-anchor="middle" fill="#04342C">Coordinator queues</text>
<text class="ts" x="340" y="156" text-anchor="middle">status pending &#183; WS broadcast</text>
<line x1="340" y1="174" x2="340" y2="200" class="arr" marker-end="url(#arrow)"/>

<rect x="190" y="202" width="300" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="340" y="224" text-anchor="middle" fill="#26215C">Agent executes</text>
<text class="ts" x="340" y="242" text-anchor="middle">runner: robocopy / rsync</text>
<line x1="340" y1="260" x2="340" y2="286" class="arr" marker-end="url(#arrow)"/>

<rect x="190" y="288" width="300" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text class="th" x="340" y="310" text-anchor="middle" fill="#04342C">Report result</text>
<text class="ts" x="340" y="328" text-anchor="middle">PATCH status &#8594; job_runs</text>
<line x1="340" y1="346" x2="340" y2="372" class="arr" marker-end="url(#arrow)"/>

<rect x="190" y="374" width="300" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text class="th" x="340" y="396" text-anchor="middle" fill="#412402">Evaluate alerts</text>
<text class="ts" x="340" y="414" text-anchor="middle">on_failure &#183; duration &#183; missed</text>
</svg>
