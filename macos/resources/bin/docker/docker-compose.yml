version: "3.8"

services:
  arcvault-server:
    image: arcvault/server:latest
    container_name: arcvault-server
    env_file:
      - ../../config/.env
    ports:
      - "${CONTROLLER_PORT:-8501}:8501"
    volumes:
      - ../../data/keys:/app/keys
      - ../../data/logs:/app/logs
      - ../../config:/app/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: arcvault-nginx
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ../../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../data/keys:/etc/nginx/ssl:ro
    depends_on:
      - arcvault-server
    restart: unless-stopped
    profiles:
      - with-nginx

volumes:
  keys:
  logs:
  config:

