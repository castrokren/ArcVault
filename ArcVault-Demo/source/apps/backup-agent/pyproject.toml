[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "backup-agent"
version = "0.1.0"
description = "Lightweight FastAPI agent to run backup jobs and stream logs"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.22",
    "pydantic>=2.5",
    "PyJWT>=2.8",
]

[project.scripts]
backup-agent = "agent.app:app"

[tool.setuptools.packages.find]
include = ["agent*"]
exclude = ["keys*"]


