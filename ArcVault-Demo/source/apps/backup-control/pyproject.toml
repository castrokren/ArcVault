[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "backup-control"
version = "0.1.0"
description = "Streamlit control plane to orchestrate backup agents"
requires-python = ">=3.9"
dependencies = [
    "streamlit>=1.31",
    "requests>=2.31",
    "PyJWT>=2.8",
]


